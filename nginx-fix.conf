# Add this to your Nginx configuration
# /etc/nginx/sites-available/wheelsenchntment.com

server {
    server_name wheelsenchntment.com www.wheelsenchntment.com;

    # Increase client body size limit for file uploads
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Frontend - React App
    root /var/www/WHEELS_ENCHANTMENT/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts and body size for API
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        client_max_body_size 50M;
    }

    # Backend uploads
    location /uploads {
        proxy_pass http://localhost:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend health check
    location /health {
        proxy_pass http://localhost:5003;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/wheelsenchntment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheelsenchntment.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.wheelsenchntment.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = wheelsenchntment.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name wheelsenchntment.com www.wheelsenchntment.com;
    return 404;
}
